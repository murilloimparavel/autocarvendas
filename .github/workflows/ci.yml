name: AutoCarVendas CI / QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Migrations, lint and production build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: autocarvendas_ci
          POSTGRES_USER: autocarvendas_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autocarvendas_ci -d autocarvendas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://autocarvendas_ci:ci-only-password@127.0.0.1:5432/autocarvendas_ci
      SESSION_SECRET: autocarvendas-ci-only-session-secret-never-use-in-production
      S3_BUCKET_NAME: autocarvendas-media
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ci-only
      S3_SECRET_ACCESS_KEY: ci-only
      S3_ENDPOINT: https://s3.caldasindica.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply all migrations to disposable PostgreSQL
        run: npm run migrate
      - name: Lint
        run: npm run lint -- --quiet
        continue-on-error: true
      - name: Build production application
        run: npm run build

  image:
    name: Build and publish immutable GHCR image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy pinned image through Coolify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.COOLIFY_APP_UUID != ''
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - name: Point Coolify to this commit's image
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_BASE_URL"
          test -n "$COOLIFY_APP_UUID"
          test -n "$COOLIFY_API_TOKEN"
          curl --fail --silent --show-error \
            -X PATCH "$COOLIFY_BASE_URL/api/v1/applications/$COOLIFY_APP_UUID" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg tag "$IMAGE_TAG" '{docker_registry_image_tag: $tag}')" \
            --output /dev/null
          response=$(curl --fail --silent --show-error \
            -X POST "$COOLIFY_BASE_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN")
          deployment_uuid=$(printf '%s' "$response" | jq -er '.deployments[0].deployment_uuid')
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"
        id: deploy
      - name: Wait for deployment and verify HTTPS
        env:
          DEPLOYMENT_UUID: ${{ steps.deploy.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            deployment=$(curl --fail --silent --show-error \
              "$COOLIFY_BASE_URL/api/v1/deployments/$DEPLOYMENT_UUID" \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN")
            status=$(printf '%s' "$deployment" | jq -r '.status')
            echo "Coolify deployment status: $status"
            if [ "$status" = "finished" ]; then break; fi
            if [ "$status" = "failed" ]; then exit 1; fi
            sleep 10
          done
          test "${status:-}" = "finished"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --output /dev/null https://autorcarvendas.caldasindica.com/; then
              exit 0
            fi
            sleep 10
          done
          echo 'The image deployed, but the domain/valid TLS health check failed.' >&2
          exit 1
